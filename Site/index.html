<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Touch Read</title>
  <style>
    :root{
      --bg:#0f1724;
      --card:#0b1220;
      --accent:#6ee7b7;
      --muted:#94a3b8;
      --glass: rgba(255,255,255,0.04);
      --danger:#f87171;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      background: linear-gradient(135deg,#071129 0%, #071b2a 60%);
      color:#e6eef6;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:32px;
    }

    /* Login */
    .container{
      width:100%;
      max-width:420px;
      background: var(--glass);
      backdrop-filter: blur(14px);
      border-radius:16px;
      padding:36px 28px;
      box-shadow: 0 8px 40px rgba(2,6,23,0.7);
      border:1px solid rgba(255,255,255,0.06);
      animation: fadeIn 0.8s ease;
    }
    @keyframes fadeIn {
      from {opacity:0; transform:translateY(20px);}
      to {opacity:1; transform:translateY(0);}
    }
    h1{font-size:24px;margin:0 0 12px;font-weight:600;color:var(--accent);}
    p.lead{margin:6px 0 22px;color:var(--muted);font-size:15px;}
    form{display:grid;gap:18px}
    label{font-size:14px;color:var(--muted);display:block;margin-bottom:6px;text-align:left}
    input{
      width:100%;padding:12px 14px;border-radius:8px;
      border:1px solid rgba(255,255,255,0.08);
      background:rgba(255,255,255,0.03);color:inherit;font-size:15px;outline:none;
    }
    input:focus{border-color: var(--accent);box-shadow: 0 0 0 3px rgba(110,231,183,0.15);}
    button{
      background:var(--accent);color:#0f1724;border:none;padding:12px;border-radius:10px;
      font-weight:600;font-size:15px;cursor:pointer;
    }
    .error{color: var(--danger);font-size:14px;text-align:center;}

    /* Leitor */
    .card {
      background: #1e293b;
      padding: 28px;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      width: 320px;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.45);
    }
    h2 { font-size: 1.2rem; margin-bottom: 8px; color: #e2e8f0; }
    p { font-size: 0.9rem; color: #94a3b8; margin: 0 0 10px; }
    input[type="file"] {
      padding: 10px;border-radius: 10px;background: #0f172a;
      border: 1px solid #334155;color: #e2e8f0;cursor: pointer;
    }
    .btn {
      padding: 12px;border-radius: 10px;border: none;cursor: pointer;font-weight: 600;
      background: linear-gradient(135deg, #6366f1, #3b82f6);color: white;text-align: center;
    }
    #download { display: none; }
    .hidden{display:none;}
  </style>
</head>
<body>
  <!-- Login -->
  <main id="loginScreen" class="container hidden">
    <div id="welcome">
      <h1>Touch Read</h1>
      <p class="lead">Preparando o ambiente...</p>
    </div>

    <form id="loginForm" class="hidden">
      <div id="step1">
        <label for="email">Usuário</label>
        <input id="email" name="email" type="text" placeholder="Digite seu usuário" required>
      </div>

      <div id="step2" class="hidden">
        <label for="password">Senha</label>
        <input id="password" name="password" type="password" placeholder="••••••••" required>
      </div>

      <div id="errorMessage" class="error hidden">Usuário ou senha incorretos.</div>

      <button type="submit" id="loginBtn" class="hidden">Entrar</button>
    </form>
  </main>

  <!-- Leitor PDF -->
  <div id="readerScreen" class="card hidden">
    <h2>PDF → TXT</h2>
    <p>Selecione um arquivo PDF para extrair o texto.<br><small>(Ou pressione <b>F</b>)</small></p>
    <input id="file" type="file" accept="application/pdf" />
    <a id="download" class="btn" download>Baixar TXT</a>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

    const loginScreen = document.getElementById("loginScreen");
    const readerScreen = document.getElementById("readerScreen");
    const loginForm = document.getElementById("loginForm");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const step1 = document.getElementById("step1");
    const step2 = document.getElementById("step2");
    const loginBtn = document.getElementById("loginBtn");
    const errorMessage = document.getElementById("errorMessage");

    const fileInput = document.getElementById("file");
    const downloadA = document.getElementById("download");

    let usuariosAPI = [];

    async function fetchUsuarios() {
      try {
        const res = await fetch('https://api-login-ud37.onrender.com/usuarios');
        const data = await res.json();
        usuariosAPI = data.usuarios || [];
      } catch (err) {
        console.error("Erro ao buscar usuários:", err);
      }
    }
    fetchUsuarios();

    function showReader() {
      loginScreen.classList.add("hidden");
      readerScreen.classList.remove("hidden");
      localStorage.setItem("isLogged", "true");
    }

    // Verifica login salvo
    if (localStorage.getItem("isLogged") === "true") {
      showReader();
    } else {
      loginScreen.classList.remove("hidden");
      setTimeout(() => {
        document.getElementById("welcome").classList.add("hidden");
        loginForm.classList.remove("hidden");
        emailInput.focus();
      }, 2000);
    }

    emailInput.addEventListener("keydown", e => {
      if (e.key === "Enter") {
        e.preventDefault();
        if (emailInput.value.trim() !== "") {
          step1.classList.add("hidden");
          step2.classList.remove("hidden");
          loginBtn.classList.remove("hidden");
          passwordInput.focus();
        }
      }
    });

    loginForm.addEventListener("submit", e => {
      e.preventDefault();
      const usuarioDigitado = emailInput.value.trim();
      const senhaDigitada = passwordInput.value.trim();
      const usuarioValido = usuariosAPI.find(
        u => u.usuario === usuarioDigitado && u.senha === senhaDigitada
      );

      if (usuarioValido) {
        errorMessage.classList.add("hidden");
        showReader();
      } else {
        errorMessage.classList.remove("hidden");
        passwordInput.value = "";
        step2.classList.add("hidden");
        loginBtn.classList.add("hidden");
        step1.classList.remove("hidden");
        emailInput.focus();
      }
    });

    // ---- Leitor PDF ----
    async function extractTextFromPDF(arrayBuffer) {
      const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
      let fullText = '';
      for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const content = await page.getTextContent();
        const strings = content.items.map(item => item.str);
        fullText += strings.join(' ') + '\n\n';
      }
      return fullText.trim();
    }

    async function enviarParaServidor(texto) {
      try {
        const response = await fetch("https://leitor-tr.onrender.com/upload-text", {
          method: "POST",
          headers: { "Content-Type": "text/plain" },
          body: texto,
        });
        const result = await response.json();
        alert("Texto enviado para o servidor!");
        console.log(result);
      } catch (err) {
        console.error("Erro ao enviar para servidor:", err);
        alert("Erro ao enviar para servidor.");
      }
    }

    fileInput.addEventListener("change", async (e) => {
      const file = e.target.files[0];
      if (!file || !/pdf$/i.test(file.type)) {
        alert("Selecione um arquivo PDF válido.");
        return;
      }
      try {
        const buf = await file.arrayBuffer();
        const text = await extractTextFromPDF(buf);
        await enviarParaServidor(text);
      } catch (err) {
        alert("Erro ao ler o PDF.");
        console.error(err);
      }
    });

    document.addEventListener("keydown", (e) => {
      if (e.key.toLowerCase() === "f") {
        fileInput.click();
      }
    });
  </script>
</body>
</html>
